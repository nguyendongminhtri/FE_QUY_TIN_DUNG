<div class="change-password-container">
  <mat-card class="change-password-card">
    <mat-card-title>Đổi mật khẩu</mat-card-title>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-card-content>
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Mật khẩu cũ</mat-label>
          <input matInput [type]="hideOld ? 'password' : 'text'" formControlName="oldPassword">
          <button mat-icon-button matSuffix type="button" (click)="hideOld = !hideOld">
            <mat-icon>{{ hideOld ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>Vui lòng nhập mật khẩu cũ</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Mật khẩu mới</mat-label>
          <input matInput [type]="hideNew ? 'password' : 'text'" formControlName="newPassword">
          <button mat-icon-button matSuffix type="button" (click)="hideNew = !hideNew">
            <mat-icon>{{ hideNew ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('newPassword')?.hasError('required')">Vui lòng nhập mật khẩu mới</mat-error>
          <mat-error *ngIf="form.get('newPassword')?.hasError('minlength')">Tối thiểu 6 ký tự</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Nhập lại mật khẩu mới</mat-label>
          <input matInput [type]="hideConfirm ? 'password' : 'text'" formControlName="confirmPassword">
          <button mat-icon-button matSuffix type="button" (click)="hideConfirm = !hideConfirm">
            <mat-icon>{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('confirmPassword')?.hasError('required')">Vui lòng nhập lại mật khẩu mới</mat-error>
        </mat-form-field>

        <mat-error *ngIf="form.hasError('mismatch') && form.get('confirmPassword')?.touched">
          Mật khẩu nhập lại không khớp
        </mat-error>
      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-button type="button" (click)="cancel()">Hủy</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || loading">
          Xác nhận
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
