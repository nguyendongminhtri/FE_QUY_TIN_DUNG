<div class="user-mgmt-container">
  <mat-card>
    <mat-card-title>Quản lý user</mat-card-title>

    <mat-form-field appearance="fill" class="filter-field">
      <mat-label>Tìm kiếm</mat-label>
      <input matInput (keyup)="applyFilter($any($event.target).value)"
             placeholder="Tên, username, email...">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

    <div class="table-wrapper">
      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="index">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let u; let i = index">{{ i + 1 }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Họ tên</th>
          <td mat-cell *matCellDef="let u">{{ u.name }}</td>
        </ng-container>

        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef>Username</th>
          <td mat-cell *matCellDef="let u">{{ u.username }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let u">{{ u.email }}</td>
        </ng-container>

        <ng-container matColumnDef="roles">
          <th mat-header-cell *matHeaderCellDef>Phân quyền</th>
          <td mat-cell *matCellDef="let u">
            <mat-select multiple [value]="u.roles" class="role-select"
                        (selectionChange)="onRolesChange(u, $event.value)">
              <mat-option *ngFor="let r of allRoles" [value]="r">{{ r }}</mat-option>
            </mat-select>
          </td>
        </ng-container>

        <ng-container matColumnDef="locked">
          <th mat-header-cell *matHeaderCellDef>Khoá tài khoản</th>
          <td mat-cell *matCellDef="let u">
            <mat-slide-toggle [checked]="u.locked" color="warn"
                              (change)="onToggleLock(u, $event)">
              {{ u.locked ? 'Đã khoá' : 'Hoạt động' }}
            </mat-slide-toggle>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"
            [class.locked-row]="row.locked"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">Không có dữ liệu</td>
        </tr>
      </table>
    </div>
  </mat-card>
</div>
