<div class="avatar-container">
  <h2>Thay đổi ảnh đại diện</h2>

  <div class="avatar-preview">
    <img [src]="avatar" width="120" height="120" alt="Ảnh đại diện">
  </div>

  <input #fileInput type="file" accept="image/*" hidden (change)="onFileSelected($event)">
  <button mat-stroked-button type="button" (click)="fileInput.click()">
    Chọn ảnh từ máy
  </button>
  <p class="file-name" *ngIf="selectedFile">{{ selectedFile.name }}</p>

  <p class="msg-error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p class="msg-success" *ngIf="successMessage">{{ successMessage }}</p>

  <button mat-raised-button color="primary" class="btn-save"
          [disabled]="!selectedFile || loading" (click)="updateAvatar()">
    {{ loading ? 'Đang lưu...' : 'Lưu ảnh đại diện' }}
  </button>
</div>
